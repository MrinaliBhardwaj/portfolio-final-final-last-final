<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>Mrinali Bhardwaj</title>
    <meta
      name="description"
      content="Mrinali Bhardwaj. One person, two practices: design and tech."
    />
    <!-- THE ONE TAG THAT CAN UNPUBLISH THE WHOLE SITE. A canonical does not
         describe this page, it NAMES the authoritative copy of it — so a
         crawler that reads it stops treating this URL as the original and goes
         to the address given here instead. It read mrinalibhardwaj.com until
         30 Sep 2026, a domain that was never registered: Google followed the
         instruction, found NXDOMAIN, and indexed nothing. `site:mrinali.in`
         returned zero pages while the GitHub repo ranked for her name.

         So it must always be the host that actually serves a 200, and `www`
         is that host — the apex 301s to it, and a canonical should not point
         at a redirect. If this ever moves, this string and the three below
         move WITH it, in the same commit. -->
    <link rel="canonical" href="https://www.mrinali.in/" />

    <!-- Tab and home-screen icons: her monogram, "mb" in Pinyon Script — the
         same mark every world signs itself with — cut from the font as
         outlines by scripts/build_favicon.py. It was a tight crop of the
         cover's lotus until 12 Sep 2026; a photograph at 32px is a smudge, and
         one that names nobody.

         SVG FIRST, because a tab is rendered at 16, 32 and sometimes 64 and a
         script hairline needs the vector at the small end. The PNGs stay for
         Safari's home-screen bookmark and for anything that ignores SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- THE SHARE CARD. A portfolio's main distribution channel is a pasted
         link — in a LinkedIn message, an email to a recruiter, a DM. Without
         these it renders as a bare URL with no image, no title and no
         description, which is the worst possible first impression for a site
         whose whole argument is visual.

         og:image MUST be absolute: LinkedIn and Facebook do not resolve a
         relative path. If the domain below is ever wrong, the card silently
         falls back to no image at all, so it is the one string to update when
         this ships somewhere new. It WAS wrong, for as long as the site has
         been live — every link she pasted into a recruiter's inbox rendered
         without the lotus. The comment predicted the failure and the tag kept
         it anyway; see the canonical note above. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mrinali Bhardwaj" />
    <meta property="og:title" content="Mrinali Bhardwaj — design & engineering" />
    <meta
      property="og:description"
      content="One person, two practices. A design portfolio that opens like a Figma file, and an engineering one that opens like an editor."
    />
    <meta property="og:url" content="https://www.mrinali.in/" />
    <meta property="og:image" content="https://www.mrinali.in/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A pale blue lotus in bloom against a black, star-scattered sky."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mrinali Bhardwaj — design & engineering" />
    <meta
      name="twitter:description"
      content="One person, two practices. A design portfolio that opens like a Figma file, and an engineering one that opens like an editor."
    />
    <meta name="twitter:image" content="https://www.mrinali.in/og.jpg" />

    <!-- the cover's resting pose: on screen at first paint, so the lotus is
         never absent while the bloom's frames stream in -->
    <link
      rel="preload"
      as="image"
      href="/lotus-still.webp"
      fetchpriority="high"
    />
    <!-- every frame of the bloom, in one small sprite atlas. Preloaded HERE,
         during HTML parse, rather than waiting for React to mount and an
         effect to run — the moment it decodes the whole scroll timeline is
         scrubbable, which is what makes the first scroll smooth instead of
         stuttering. The full-size frames stream in behind it. -->
    <link
      rel="preload"
      as="image"
      href="/lotus/atlas.webp"
      fetchpriority="high"
    />

    <!-- THE FIRST FRAME, PAINTED BEFORE REACT EXISTS.
         The poster was already preloaded above and already the intended first
         thing on screen — but the only element rendering it lived inside the
         React tree, so it could not appear until the bundle had downloaded,
         compiled, mounted and committed. Measured on the built site at 4x CPU
         throttle: first contentful paint at 1.9s, of which the last 1.5s was a
         black screen with the poster sitting decoded and idle in the cache.
         That wait is the "lag on opening".

         So the same image is also rendered here, in markup, where it paints as
         soon as the HTML and the stylesheet are in — and Cover removes this
         layer in a layout effect, in the same frame its own poster commits.
         The two are the same file at the same size, so the handoff is a swap
         of identical pixels.

         It is NOT shown to a returning visitor: the cover lands them on the
         settled desktop rather than at the top of the ceremony, so a lotus
         here would be a flash of something they are not about to see. The
         script below reads the same sessionStorage key Cover does.

         If the bundle never arrives, this stays — a lotus is a better failure
         than a black rectangle. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #010104;
      }
      #boot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* the ceremony is already spent: Cover will land on the desk, not here */
      .mb-seen #boot {
        display: none;
      }
    </style>
    <script>
      // Two reasons not to paint it, and both have to be settled HERE, before
      // the layer is parsed — deciding later means a lotus flashing over
      // something else first.
      //   · the ceremony is already spent, so Cover will land on the desk
      //     (the key must stay in step with INTRO_SEEN in src/Cover.jsx)
      //   · this is a world, not the cover. #/tech and friends never mount
      //     Cover at all, and a full-screen lotus over the editor is exactly
      //     the bug this guard exists to prevent.
      try {
        var path = location.hash.replace(/^#/, "").split("?")[0];
        var onCover = path === "" || path === "/";
        if (!onCover || sessionStorage.getItem("mb-intro-seen") === "1")
          document.documentElement.classList.add("mb-seen");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img src="/lotus-still.webp" alt="" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
